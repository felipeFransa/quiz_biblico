name: quiz_biblico
description: "Bible Quiz - Um jogo de quiz bíblico rápido e viciante."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0-dev.0
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  google_mobile_ads: ^5.2.0
  confetti: ^0.7.0
  share_plus: ^10.1.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1035"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/data/bible_acf.json
    - assets/audio/
